<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183d2b"><title>Member access | Eco Kuku</title><style>
:root{--forest:#183d2b;--green:#2f6545;--paper:#f7faf5;--line:#dce6da;--muted:#66746a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#203027;font:15px/1.55 Arial,sans-serif}.top{background:var(--forest);color:white;padding:16px 0}.wrap{width:min(980px,calc(100% - 32px));margin:auto}.brand{font-size:22px;font-weight:900;color:white;text-decoration:none}.brand span{color:#b6d2a8}.layout{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:42px 0}.card{width:min(480px,100%);background:white;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 16px 45px #183d2b12}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{font-size:32px;line-height:1.1;letter-spacing:-.04em;color:var(--forest);margin:8px 0}p{color:var(--muted)}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button,.submit{border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer}.tabs button{background:#edf3e9;color:var(--forest);flex:1}.tabs button[aria-selected=true],.submit{background:var(--forest);color:white}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:700}.field input{width:100%;border:1px solid #d4dfd2;border-radius:8px;padding:13px;font:14px Arial}.submit{width:100%;margin-top:10px}.message{font-size:13px;margin-top:14px;overflow-wrap:anywhere}.hint{font-size:11px;margin-top:20px}.hidden{display:none!important}a{color:var(--green)}@media(max-width:520px){.card{padding:22px}}
</style></head><body><header class="top"><div class="wrap"><a class="brand" href="./">eco<span>kuku</span></a></div></header><main class="layout"><section class="card"><div class="eyebrow">Eco Kuku member area</div><h1>Welcome to your account</h1><p>Create a member account or sign in to view your referral activity.</p><div class="tabs"><button id="loginTab" type="button" aria-selected="true">Sign in</button><button id="signupTab" type="button" aria-selected="false">Create account</button></div>
<form id="memberForm"><div id="nameField" class="field hidden"><label for="fullName">Full name</label><input id="fullName" autocomplete="name"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><div id="refField" class="field hidden"><label for="refCode">Referral code (optional)</label><input id="refCode" autocomplete="off"></div><button class="submit" id="submitBtn" type="submit">Sign in</button></form><p id="message" class="message" role="status" aria-live="polite"></p><p class="hint">Your password is handled by Supabase authentication. Eco Kuku does not receive or store your password.</p><p class="hint"><a href="rewards.html">Back to dashboard preview</a> · <a href="./">Home</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script>
const $=id=>document.getElementById(id);let mode="login";const params=new URLSearchParams(location.search);$("refCode").value=(params.get("ref")||"").toUpperCase();
function setMode(next){mode=next;const signup=mode==="signup";$("loginTab").setAttribute("aria-selected",String(!signup));$("signupTab").setAttribute("aria-selected",String(signup));$("nameField").classList.toggle("hidden",!signup);$("refField").classList.toggle("hidden",!signup);$("fullName").required=signup;$("submitBtn").textContent=signup?"Create account":"Sign in";$("password").autocomplete=signup?"new-password":"current-password";$("message").textContent=""}
$("loginTab").addEventListener("click",()=>setMode("login"));$("signupTab").addEventListener("click",()=>setMode("signup"));
$("memberForm").addEventListener("submit",async e=>{e.preventDefault();$("message").textContent="";if(!window.supabase||!window.ECO_SUPABASE_URL||!window.ECO_SUPABASE_ANON_KEY||window.ECO_SUPABASE_URL.includes("YOUR_")){$("message").textContent="Account service is not connected yet. Eco Kuku must add its Supabase project URL and public anon key.";return}const client=window.supabase.createClient(window.ECO_SUPABASE_URL,window.ECO_SUPABASE_ANON_KEY);$("submitBtn").disabled=true;try{let result;if(mode==="signup"){result=await client.auth.signUp({email:$("email").value.trim(),password:$("password").value,options:{data:{full_name:$("fullName").value.trim(),referred_by_code:$("refCode").value.trim().toUpperCase()}}})}else{result=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value})}if(result.error)throw result.error;if(mode==="signup"&&!result.data.session){$("message").textContent="Check your email for the confirmation link, then return here to sign in."}else{location.href="rewards.html"}}catch(err){$("message").textContent=err.message||"Unable to complete your request."}finally{$("submitBtn").disabled=false}});
</script></body></html>
